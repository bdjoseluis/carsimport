server.port=${SERVER_PORT:8087}

# ---------------------------------------------------------------------------
# Base de datos
# Sin valores por defecto con credenciales reales: si faltan, la app no arranca.
# Ver .env.example en la raiz del proyecto.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/concesionario_db?serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
# show-sql desactivado: en produccion llenaba el disco de logs.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.sql.init.mode=always
# Sin esto, data.sql se lee con la codificacion de la maquina (en Windows,
# cp1252) y las descripciones del catalogo llegan a la base de datos con los
# acentos rotos.
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------------------
# Seguridad
# ---------------------------------------------------------------------------
# Obligatorio en produccion. Si se deja vacio se genera uno aleatorio al
# arrancar y los tokens caducan en cada reinicio (solo valido para desarrollo).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Origenes permitidos para CORS, separados por comas. En produccion el front va
# bajo el mismo dominio que la API, asi que no hace falta anadir nada.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------------------------------------------------------------------------
# Documentacion de la API
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# ---------------------------------------------------------------------------
# Healthcheck (lo usa Docker para saber si el contenedor esta vivo)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Ingesta de anuncios importados
# ---------------------------------------------------------------------------
apify.api-token=${APIFY_API_TOKEN:}
apify.dataset-id=${APIFY_DATASET_ID:}
apify.autoscout-dataset-id=${APIFY_AUTOSCOUT_DATASET_ID:}
catalogo.fuente=${CATALOGO_FUENTE:ambos}
ingesta.frecuencia=${INGESTA_FRECUENCIA:NUNCA}
ingesta.max-items=${INGESTA_MAX_ITEMS:2000}
