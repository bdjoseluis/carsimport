# Configuracion solo para tests: base de datos H2 en memoria, sin MySQL.
spring.datasource.url=jdbc:h2:mem:carsimport_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# data.sql usa sintaxis de MySQL (SELECT ... WHERE NOT EXISTS sin FROM), que H2
# no acepta. Cada test siembra los datos que necesita.
spring.sql.init.mode=never

jwt.secret=secreto-solo-para-tests-con-longitud-mas-que-suficiente-1234567890
jwt.expiration-ms=3600000

ingesta.frecuencia=NUNCA
apify.api-token=
apify.dataset-id=
