server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip para que la primera carga pese lo menos posible
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # La API va bajo el mismo dominio: asi no hay CORS de por medio.
    location /api/ {
        proxy_pass http://carsimport-api:8087;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Los ficheros con hash en el nombre se pueden cachear para siempre.
    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular es una SPA: cualquier ruta desconocida la resuelve el router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
